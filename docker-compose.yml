# Neo4j for the knowledge graph. `docker compose up -d` then open http://localhost:7474
# (login neo4j / testsigma123). Bolt driver connects on 7687.
services:
  neo4j:
    image: neo4j:5.24
    container_name: testsigma-neo4j
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    environment:
      - NEO4J_AUTH=neo4j/testsigma123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
